name: CI & Docker Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Test & Typecheck Frontend
      run: |
        cd frontend
        npm install --legacy-peer-deps
        npx tsc --noEmit
        npm test

    - name: Build Docker image
      run: docker build . --file Dockerfile --tag pro-alumn-backend:latest

